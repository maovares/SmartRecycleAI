name: Build Release APK

on:
  release:
    types: [created]
permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Restore google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > google-services.json

      - name: Expo prebuild
        run: npx expo prebuild --platform android --non-interactive
        env:
          NODE_ENV: production

      - name: Patch CMake version
        run: sed -i 's/version "3.31.0"/version "3.31.6"/' android/app/build.gradle

      - name: Install CMake 3.31.6
        run: echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "cmake;3.31.6"

      - name: Build APK
        run: ./gradlew assembleDebug
        working-directory: android
        env:
          NODE_ENV: production
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/SmartRecycle-v*.apk

      - name: Locate built APK
        id: apk
        working-directory: android/app/build/outputs/apk/debug
        run: echo "path=$(pwd)/$(ls SmartRecycle-v*.apk)" >> "$GITHUB_OUTPUT"

      - name: Extract Firebase Android App ID
        id: firebase
        run: echo "app_id=$(jq -r '.client[0].client_info.mobilesdk_app_id' google-services.json)" >> "$GITHUB_OUTPUT"

      - name: Upload APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ steps.firebase.outputs.app_id }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: beta-testers
          file: ${{ steps.apk.outputs.path }}
          releaseNotes: ${{ github.event.release.body }}
