<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 180" width="460" height="180">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D7A60"/>
      <stop offset="100%" stop-color="#1DB983"/>
    </linearGradient>
  </defs>

  <!-- Icon: rounded square background -->
  <rect x="4" y="4" width="172" height="172" rx="38" fill="url(#iconGrad)"/>

  <!--
    Recycling arrows: three 100° arcs (220°→320°) rotated 0°/120°/240°,
    centered at (90,90) with radius 50.
    Arc start (220°): (-38.3, -32.1)  Arc end (320°): (38.3, -32.1)
    Arrowhead tip at (38.3,-32.1), tangent direction 50° → points lower-right.
  -->
  <g transform="translate(90, 90)">
    <!-- Arrow 1 — top -->
    <path d="M -38.3,-32.1 A 50,50 0 0,1 38.3,-32.1"
          fill="none" stroke="white" stroke-width="10" stroke-linecap="round"/>
    <polygon points="38.3,-32.1 26.1,-38.8 33.8,-45.3" fill="white"/>

    <!-- Arrow 2 — lower-right -->
    <g transform="rotate(120)">
      <path d="M -38.3,-32.1 A 50,50 0 0,1 38.3,-32.1"
            fill="none" stroke="white" stroke-width="10" stroke-linecap="round"/>
      <polygon points="38.3,-32.1 26.1,-38.8 33.8,-45.3" fill="white"/>
    </g>

    <!-- Arrow 3 — lower-left -->
    <g transform="rotate(240)">
      <path d="M -38.3,-32.1 A 50,50 0 0,1 38.3,-32.1"
            fill="none" stroke="white" stroke-width="10" stroke-linecap="round"/>
      <polygon points="38.3,-32.1 26.1,-38.8 33.8,-45.3" fill="white"/>
    </g>
  </g>

  <!-- Leaf at icon center (90, 90) -->
  <path d="M90,72 C102,72 108,85 101,97 C95,109 74,106 74,92 C74,76 82,72 90,72 Z"
        fill="#A8EDD5" opacity="0.92"/>
  <line x1="90" y1="72" x2="88" y2="104"
        stroke="#0D7A60" stroke-width="2" stroke-linecap="round"/>

  <!-- Sparkle dot — signals the "smart / AI" aspect -->
  <circle cx="102" cy="73" r="5" fill="white" opacity="0.85"/>
  <circle cx="102" cy="73" r="2.2" fill="#5DCAA5"/>

  <!-- Wordmark -->
  <text x="194" y="76"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="48" font-weight="300" letter-spacing="-1"
        fill="#1A1A1A">Smart</text>

  <rect x="316" y="47" width="40" height="22" rx="6" fill="#5DCAA5"/>
  <text x="336" y="63"
        font-family="Arial, sans-serif" font-size="13" font-weight="700"
        fill="white" text-anchor="middle">AI</text>

  <text x="194" y="141"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="48" font-weight="800" letter-spacing="-1"
        fill="#0D7A60">Recycle</text>
</svg>
